<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artikel — Westkust Society</title><style>
body{margin:0;background:#f7f3ea;color:#17212b;font-family:Georgia,serif}header{background:#16212b;color:#fff;padding:22px 6%}.wrap{max-width:900px;margin:auto;padding:55px 6%}.meta{font:12px Arial;color:#8d3f25;text-transform:uppercase;letter-spacing:1px}h1{font-size:52px;line-height:1.08}.dek{font-size:20px;color:#5d6670;line-height:1.55}.cover{width:100%;max-height:480px;object-fit:cover;margin:25px 0}.body{font-size:19px;line-height:1.8}.body img{max-width:100%;height:auto}.tags span{display:inline-block;border:1px solid #d9cfc1;padding:5px 9px;border-radius:20px;font:11px Arial;margin:4px 4px 0 0}.sourcebox,.notes,.refs{background:#fffdf8;border:1px solid #ddd4c5;padding:22px;margin-top:35px}.source{padding:12px 0;border-bottom:1px solid #e5ded3}.source:last-child{border-bottom:0}.source b{color:#8d3f25;font:11px Arial}.notes{font-size:15px;line-height:1.65}.refs{font:14px Arial;color:#555;white-space:pre-wrap}.back{font:13px Arial}</style></head><body><header><b>SUMATRA'S WESTKUST SOCIETY</b></header><main class="wrap" id="app"></main>
<script>
const id=new URLSearchParams(location.search).get('id'),A=JSON.parse(localStorage.getItem('sws_articles')||'[]'),x=A.find(a=>a.id===id),app=document.getElementById('app');
function esc(s){return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function sources(s){return (s||'').split('\\n').filter(Boolean).map(line=>{let p=line.split('|').map(v=>v.trim());return `<div class="source"><b>${esc(p[0]||'SUMBER')}</b><br><strong>${esc(p[1]||'')}</strong><br>${esc(p[2]||'')}${p[3]?`<br><a href="${esc(p[3])}" target="_blank" rel="noopener">Buka sumber ↗</a>`:''}</div>`}).join('')}
if(!x){app.innerHTML='<h1>Artikel tidak ditemukan</h1><a href="index.html">Kembali</a>'}else{document.title=x.title+' — Westkust Society';app.innerHTML=`<a class="back" href="category.html?cat=${encodeURIComponent(x.category||'Sejarah Batahan')}">← Kembali ke ${esc(x.category||'Sejarah')}</a><p class="meta">${esc(x.category)} · ${esc(x.date)} · ${esc(x.author)}</p><h1>${esc(x.title)}</h1><p class="dek">${esc(x.excerpt)}</p>${x.cover?`<img class="cover" src="${esc(x.cover)}" alt="">`:''}<div class="tags">${(x.tags||'').split(',').filter(Boolean).map(t=>`<span>${esc(t.trim())}</span>`).join('')}</div><div class="body">${x.content||''}</div>${x.sources?`<section class="sourcebox"><h2>Jejak Sumber</h2>${sources(x.sources)}</section>`:''}${x.notes?`<section class="notes"><h3>Catatan Penulis</h3><div>${esc(x.notes).replace(/\\n/g,'<br>')}</div></section>`:''}${x.references?`<section class="refs"><h3>Sumber & Referensi</h3>${esc(x.references)}</section>`:''}`}</script></body></html>
