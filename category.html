<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kategori — Westkust Society</title><style>
body{margin:0;background:#f7f3ea;color:#17212b;font-family:Georgia,serif}header{background:#16212b;color:white;padding:22px 6%}a{color:#8d3f25}.wrap{max-width:1100px;margin:auto;padding:50px 6%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid #ddd4c5;padding:22px}.card small{font:11px Arial;color:#8d3f25;text-transform:uppercase}.card h2{font-size:23px}.card p{color:#66717c;line-height:1.5}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>SUMATRA'S WESTKUST SOCIETY</b></header><main class="wrap"><a href="index.html">← Beranda</a><h1 id="title"></h1><div id="list" class="grid"></div></main><script>
const p=new URLSearchParams(location.search),cat=p.get('cat')||'Batahan';document.getElementById('title').textContent=cat;
const A=JSON.parse(localStorage.getItem('sws_articles')||'[]').filter(x=>x.category===cat);
document.getElementById('list').innerHTML=A.length?A.slice().reverse().map(x=>`<article class="card"><small>${x.date||''}</small><h2>${x.title}</h2><p>${x.excerpt||''}</p><a href="article.html?id=${encodeURIComponent(x.id)}">Baca selengkapnya →</a></article>`).join(''):'<p>Belum ada artikel pada kategori ini.</p>';
</script></body></html>
